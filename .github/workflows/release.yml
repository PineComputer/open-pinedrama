# Releases the version in package.json when a merge to main brings one that isn't released
# yet: bump it in the pull request (`npm version minor --no-git-tag-version`), and merging
# builds macOS (signed and notarized), Windows and Linux and publishes them as release
# v<version>, which installed apps update from (desktop/updates.ts). A merge that keeps a
# released version only runs the checks (ci.yml).
#
# The release is made first as a draft pinned to the merged commit, so the three platform
# builds upload into one release, and it's published only once every installer and update
# manifest is there and matches (scripts/verify-release.mjs). macOS needs these repository
# secrets, and its build fails without them rather than release an ad-hoc app:
#
#   MACOS_CERTIFICATE           the Developer ID Application certificate, a .p12 in base64
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_API_KEY_P8            an App Store Connect API key's .p8 contents, for notarization
#   APPLE_API_KEY_ID            that key's id
#   APPLE_API_ISSUER            its issuer id
name: Release

on:
  push:
    branches: [main]
  # To finish a release whose run failed part way, once whatever stopped it is fixed.
  workflow_dispatch:

# One release at a time, and never one stopped half uploaded.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | if .draft then \"draft \" + .target_commitish else \"published\" end")
          if [ "$release" = published ]; then
            echo "$tag is released already."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag of that name must already be this commit's: a release is published at its tag.
          tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '/\^\{\}$/ { peeled = $1 } { first = first ? first : $1 } END { print peeled ? peeled : first }')
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already points at $tagged, not at $GITHUB_SHA."
            exit 1
          fi
          case "$release" in
            "") gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --generate-notes ;;
            "draft $GITHUB_SHA") echo "Carrying on with the draft of $tag." ;;
            *)
              echo "::error::A draft of $tag is for another commit (${release#draft }). Delete it to release this one."
              exit 1
              ;;
          esac
          echo "build=true" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for secret in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!secret}" ]; then
              echo "::error::The repository secret $secret is missing: a macOS release must be signed and notarized."
              exit 1
            fi
          done
          # Notarization takes the key as a file; the secret holds its contents.
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple's certificate signs the macOS build only.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node scripts/desktop.mjs
          npx electron-builder --config electron-builder.config.mjs --publish always ${{ runner.os == 'macOS' && '-c.mac.forceCodeSigning=true' || '' }}
      - name: Check the macOS apps are signed and notarized
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in "release/mac-arm64/Pine Drama Studio.app" "release/mac/Pine Drama Studio.app"; do
            codesign --verify --deep --strict "$app"
            assessment=$(spctl --assess --type execute --verbose=2 "$app" 2>&1)
            echo "$assessment"
            [[ "$assessment" == *"source=Notarized Developer ID"* ]]
            xcrun stapler validate "$app"
          done

  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release.mjs "v${{ needs.prepare.outputs.version }}"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false --latest
