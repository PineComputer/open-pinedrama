# A version tag (v0.2.0, as `npm version` makes it) builds the desktop app for macOS, Windows
# and Linux and publishes it to a draft GitHub release; publishing the draft is what installed
# apps update from (desktop/updates.ts). macOS signing and notarization use the repository
# secrets below when they are set; without them the macOS build is signed ad hoc
# (electron-builder.config.mjs).
#
#   MACOS_CERTIFICATE           the Developer ID Application certificate, a .p12 in base64
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_API_KEY_P8            an App Store Connect API key's .p8 contents, for notarization
#   APPLE_API_KEY_ID            that key's id
#   APPLE_API_ISSUER            its issuer id
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Notarization takes the key as a file; the secret holds its contents.
      - name: Notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - name: Package and publish
        shell: bash
        run: node scripts/desktop.mjs && npx electron-builder --config electron-builder.config.mjs --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple's certificate signs the macOS build only.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
